name: Build and deploy viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: layouts-${{ hashFiles('build/chips.yaml') }}
      - run: pip install -r build/requirements.txt
      - run: python build/fetch.py
      - name: Build chip data
        run: |
          for chip in $(python -c "import yaml; print(' '.join(yaml.safe_load(open('build/chips.yaml'))['chips']))"); do
            python build/build_chip.py "$chip"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
