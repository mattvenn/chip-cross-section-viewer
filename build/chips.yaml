# Logical layers shared by every chip: same key -> same colour everywhere.
# Listed bottom to top (draw order).
logical_layers:
  diff:            { name: "Diffusion",         color: "#2e9d4f" }
  poly:            { name: "Polysilicon",       color: "#d0303a" }
  top_metal_below: { name: "Top metal (lower)", color: "#b87333" }
  top_metal:       { name: "Top metal",         color: "#e0b020" }

# Render settings shared by all chips.
render:
  nm_per_px: 200      # native resolution of the deepest tile level
  tile_size: 512
  vec_cell_um: 50     # vector chunk size for cross-sections / deep zoom

# Optional per chip:
#   die: [x0, y0, x1, y1]   die outline in µm, when the PDK's die_layer can't be used
#   encoding: base64        the URL serves base64 (googlesource ?format=TEXT)
chips:
  tt02:
    name: "Tiny Tapeout 02"
    pdk: sky130
    # Full Caravel chip incl. padframe (efabless MPW-7, slot 001)
    url: https://foss-eda-tools.googlesource.com/third_party/shuttle/sky130/mpw-007/slot-001/+/refs/heads/main/tapeout/outputs/oas/caravel_00070f74.oas?format=TEXT
    encoding: base64
    file: tt02.oas
    die: [0, 0, 3600, 5200]
    repo: https://github.com/TinyTapeout/tinytapeout-02

  ttgf0p2:
    name: "Tiny Tapeout GF 0.2 (TTP2)"
    pdk: gf180mcu
    url: https://github.com/TinyTapeout/tinytapeout-gf-0p2/releases/download/tapeout-ws2512/tt_gf_wrapper.oas.tt_gf_wrapper.precheck.20251217_132152.output.gds
    file: ttgf0p2.gds
    repo: https://github.com/TinyTapeout/tinytapeout-gf-0p2

  ttihp25b:
    name: "Tiny Tapeout IHP 25b"
    pdk: sg13g2
    url: https://github.com/TinyTapeout/tinytapeout-ihp-25b/releases/download/tapeout-2509/FMD_QNC_TTIHP25b.oas
    file: ttihp25b.oas
    repo: https://github.com/TinyTapeout/tinytapeout-ihp-25b
